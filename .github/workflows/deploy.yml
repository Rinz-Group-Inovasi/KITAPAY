name: Auto Deploy KitaPay

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy ke VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /var/www/kitapay/Kitapay-Backend/backend
            git pull origin main
            npm install
            npm run build
            pm2 start dist/index.js --name kitapay-backend --restart-delay=5000 --max-restarts=5 -f
            pm2 save

