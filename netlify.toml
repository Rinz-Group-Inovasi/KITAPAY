[build]
  base = "frontend"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NEXT_PRIVATE_LOCAL_WEBPACK = "true"
  NEXT_PUBLIC_API_URL = "https://apikita.rinzgroup.web.id/api"
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_API_URL"
[[plugins]]
  package = "@netlify/plugin-nextjs"
